<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Fern</title>
<style>
  :root {
    --bg: #17161F;
    --bar: #2A2836;
    --fg: #E6E3F0;
    --dim: #8A8699;
    --you: #C3A9E6;
    --fern: #7FE0C4;
    --tool: #8FD8FF;
    --info: #A9A5B8;
    --alert: #FF8A3D;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font: 13px/1.45 Menlo, Monaco, monospace; }

  /* The left padding leaves room for the macOS window buttons. */
  header {
    -webkit-app-region: drag; user-select: none;
    display: flex; align-items: flex-end; gap: 2px;
    height: 34px; padding: 0 10px 0 80px; background: var(--bar); color: var(--dim); font-size: 11px;
  }
  header .spacer { flex: 1; align-self: center; text-align: right; }
  .tab {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; gap: 6px; max-width: 200px;
    padding: 5px 10px; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--dim);
  }
  .tab:hover { color: var(--fg); }
  .tab.active { background: var(--bg); color: var(--fg); }
  .tab .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fern); flex: none; }
  .tab.running .dot { background: var(--tool); }
  .tab.failed .dot, .tab.attention .dot { background: var(--alert); }
  .tab.cancelled .dot { background: var(--dim); }
  .tab.unread .label { font-weight: 700; color: var(--fg); }
  .tab .close { display: none; border: 0; background: none; color: var(--dim); font: inherit; cursor: pointer; padding: 0 0 0 2px; }
  .tab.closable .close { display: block; }
  .tab .close:hover { color: var(--fg); }

  .log { flex: 1; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; display: none; }
  .log.active { display: block; }
  .line { margin: 0 0 6px; }
  /* Like Claude Code: your prompt on a grey band with "> ", replies and steps after "⏺". */
  .you { background: var(--bar); color: var(--fg); padding: 2px 8px 2px 3ch; text-indent: -2ch; margin: 10px 0 8px; }
  .you::before { content: '> '; color: var(--dim); }
  .fern, .assistant { padding-left: 2ch; position: relative; }
  .fern::before, .assistant::before { content: '⏺'; position: absolute; left: 0; color: var(--fg); }
  .tool { color: var(--tool); margin-bottom: 2px; }
  .fern code, .assistant code { color: var(--you); }
  .fern strong, .assistant strong { color: #fff; }
  .md-h { font-weight: 700; color: #fff; margin-top: 4px; }
  .md-li { position: relative; }
  .md-li::before { content: attr(data-bullet); position: absolute; margin-left: -2ch; color: var(--dim); }
  .md-gap { height: 6px; }
  .link { text-decoration: underline; text-decoration-color: var(--dim); }
  pre.code, pre.table { margin: 4px 0; padding: 6px 8px; background: #100F16; white-space: pre; overflow-x: auto; }
  pre.table { background: transparent; padding: 0; }
  /* Bars for /usage and /context, drawn with text like the terminal. */
  .bar .fill { color: var(--tool); }
  .bar.mid .fill { color: #FFB27A; }
  .bar.high .fill { color: var(--alert); }
  .bar .rest { color: #3A3848; }
  .meter { margin: 6px 0 8px; }
  .meter-label { color: #fff; }
  .meter-pct { color: var(--fg); }
  .meter-note { color: var(--dim); font-size: 12px; }
  .share { color: var(--fg); white-space: pre; }
  .info { color: var(--info); }
  .job { color: var(--tool); border-left: 2px solid var(--tool); padding-left: 8px; }
  /* Job logs look like a Claude Code session: ⏺ for steps, ⎿ for tool results. */
  .tool::before { content: '⏺ '; }
  .result, .error { color: var(--dim); padding-left: 5ch; text-indent: -3ch; margin-top: -4px; }
  .result::before, .error::before { content: '⎿  '; }
  .error { color: var(--alert); }

  .approval { border: 1px solid var(--alert); padding: 8px 10px; margin: 0 0 8px; }
  .approval .q { color: #FFB27A; font-weight: 700; }
  .approval pre { margin: 6px 0; color: var(--fg); white-space: pre-wrap; }
  .approval button { font: inherit; margin-right: 8px; padding: 2px 10px; cursor: pointer; background: transparent; color: var(--fg); border: 1px solid var(--dim); }
  .approval button.allow { border-color: var(--fern); color: var(--fern); }
  .approval.done { opacity: .5; }
  .approval.done button { display: none; }
  #picker {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 48px; max-height: 60%;
    overflow-y: auto; background: var(--bar); border: 1px solid var(--dim); padding: 6px 0;
  }
  #picker.open { display: block; }
  #picker .head { padding: 2px 12px 6px; color: var(--dim); }
  #picker .chat { display: flex; gap: 12px; padding: 3px 12px; cursor: pointer; }
  #picker .chat .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #picker .chat .meta { color: var(--dim); flex: none; }
  #picker .chat.selected { background: var(--bg); color: var(--fern); }
  #picker .chat.selected .label::before { content: '❯ '; }
  #picker .chat.current .meta::after { content: ' · current'; color: var(--fern); }
  #busy { display: none; padding: 0 12px 6px; color: var(--dim); }
  #busy.on { display: block; }
  #busy::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* The input looks like Claude Code's prompt box, with a status line under it. */
  form { display: flex; align-items: center; gap: 8px; margin: 4px 12px 0; padding: 6px 10px; border: 1px solid var(--dim); border-radius: 6px; }
  form:focus-within { border-color: var(--fern); }
  form label { color: var(--dim); }
  #status { padding: 3px 14px 6px; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #complete {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 70px; max-height: 240px; overflow-y: auto;
    background: var(--bar); border: 1px solid var(--dim); padding: 4px 0;
  }
  #complete.open { display: block; }
  #complete .cmd { display: flex; gap: 12px; padding: 2px 12px; cursor: pointer; }
  #complete .cmd .name { flex: none; min-width: 18ch; }
  #complete .cmd .desc { flex: 1; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #complete .cmd .kind { flex: none; color: var(--dim); font-size: 11px; }
  #complete .cmd.k-fern .name { color: var(--fern); }
  #complete .cmd.k-claude .name { color: var(--tool); }
  #complete .cmd.k-skill .name { color: var(--you); }
  #complete .cmd.selected { background: var(--bg); }
  #complete .cmd.selected .desc { color: var(--fg); }
  input {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--fg);
    font: inherit; caret-color: var(--fern);
  }
  input::placeholder { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { #busy::after { animation: none; content: '...'; } }
</style>
</head>
<body>
  <header>
    <div id="tabs" role="tablist" style="display: contents"></div>
    <span class="spacer">/help · Esc</span>
  </header>
  <div id="logs" style="display: contents"></div>
  <div id="picker" role="listbox" aria-label="Earlier chats with Fern"></div>
  <div id="complete" role="listbox" aria-label="Commands"></div>
  <div id="busy">Fern is thinking</div>
  <form id="form" autocomplete="off">
    <label for="input">&gt;</label>
    <input id="input" placeholder="Ask Fern, or type / for commands" spellcheck="false" aria-autocomplete="list" aria-controls="complete">
  </form>
  <div id="status" aria-live="polite"></div>

<script src="panel-markdown.js"></script>
<script>
  // Lines kept per tab. Older lines are removed, so a long job does not slow the panel.
  const MAX_LINES = 1500;

  const tabsEl = document.getElementById('tabs');
  const logsEl = document.getElementById('logs');
  const input = document.getElementById('input');
  const busy = document.getElementById('busy');
  const tabs = new Map();          // id -> { tabEl, labelEl, logEl, status }
  const approvalCards = new Map(); // id -> card
  const history = [];
  let historyIndex = 0;
  let activeId;

  /** Creates a tab, or updates its title and status. */
  function upsertTab(id, title, status) {
    let tab = tabs.get(id);
    if (!tab) {
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.setAttribute('role', 'tab');
      const dot = document.createElement('span');
      dot.className = 'dot';
      const labelEl = document.createElement('span');
      labelEl.className = 'label';
      const close = document.createElement('button');
      close.className = 'close';
      close.textContent = '×';
      close.title = 'Close this tab';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(id);
      });
      tabEl.append(dot, labelEl, close);
      tabEl.addEventListener('click', () => selectTab(id));
      const logEl = document.createElement('div');
      logEl.className = 'log';
      logEl.setAttribute('role', 'log');
      tabsEl.append(tabEl);
      logsEl.append(logEl);
      tab = { tabEl, labelEl, logEl, status };
      tabs.set(id, tab);
    }
    tab.labelEl.textContent = title;
    tab.status = status;
    tab.tabEl.classList.remove('running', 'done', 'failed', 'cancelled');
    if (status) tab.tabEl.classList.add(status);
    // A job tab can close once the job has ended. Fern's tab always stays.
    tab.tabEl.classList.toggle('closable', id !== 'fern' && status !== 'running');
    return tab;
  }

  function selectTab(id) {
    const tab = tabs.get(id);
    if (!tab) return;
    activeId = id;
    for (const [otherId, t] of tabs) {
      const isActive = otherId === id;
      t.tabEl.classList.toggle('active', isActive);
      t.tabEl.setAttribute('aria-selected', String(isActive));
      t.logEl.classList.toggle('active', isActive);
    }
    tab.tabEl.classList.remove('unread', 'attention');
    tab.logEl.scrollTop = tab.logEl.scrollHeight;
  }

  function closeTab(id) {
    const tab = tabs.get(id);
    if (!tab || id === 'fern' || tab.status === 'running') return;
    tab.tabEl.remove();
    tab.logEl.remove();
    tabs.delete(id);
    if (activeId === id) selectTab('fern');
  }

  function append(tabId, el) {
    const tab = tabs.get(tabId) ?? tabs.get('fern');
    const { logEl } = tab;
    const isAtBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
    logEl.append(el);
    while (logEl.childElementCount > MAX_LINES) logEl.firstElementChild.remove();
    if (isAtBottom) logEl.scrollTop = logEl.scrollHeight;
    if (tab !== tabs.get(activeId)) tab.tabEl.classList.add('unread');
  }

  function addLine({ who, text, tab = 'fern' }) {
    const line = document.createElement('div');
    line.className = `line ${who}`;
    if (who === 'fern' || who === 'assistant') line.append(window.renderMarkdown(text));
    else line.append(document.createTextNode(text));
    append(tab, line);
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    history.push(text);
    historyIndex = history.length;
    closeComplete();
    // The input always talks to Fern, so her tab comes to the front.
    selectTab('fern');
    window.fern.send(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' && historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex];
      e.preventDefault();
    } else if (e.key === 'ArrowDown' && historyIndex < history.length) {
      historyIndex++;
      input.value = history[historyIndex] ?? '';
      e.preventDefault();
    } else if (!input.value && approvalCards.size && ['y', 'n'].includes(e.key)) {
      // With an empty input line, y or n answers the newest open question.
      e.preventDefault();
      window.fern.answerApproval([...approvalCards.keys()].at(-1), e.key === 'y');
    }
  });

  // -------------------------------------------------------------------------
  // /resume picker: ↑ ↓ to move, Enter to resume, Esc to cancel.

  const picker = document.getElementById('picker');
  let pickerChats = [];
  let pickerIndex = 0;

  function ago(ms) {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return `${Math.round(s / 86400)}d ago`;
  }

  function renderPicker() {
    picker.querySelectorAll('.chat').forEach((el, i) => {
      el.classList.toggle('selected', i === pickerIndex);
      el.setAttribute('aria-selected', String(i === pickerIndex));
      if (i === pickerIndex) el.scrollIntoView({ block: 'nearest' });
    });
  }

  function closePicker() {
    picker.classList.remove('open');
    input.focus();
  }

  function pick(i) {
    const chat = pickerChats[i];
    closePicker();
    if (chat) window.fern.resume(chat.id);
  }

  window.fern.onResumeList(({ chats, current }) => {
    pickerChats = chats;
    pickerIndex = 0;
    const head = document.createElement('div');
    head.className = 'head';
    head.textContent = 'Resume a chat with Fern  (↑↓ Enter · Esc)';
    const rows = chats.map((chat, i) => {
      const row = document.createElement('div');
      row.className = `chat${chat.id === current ? ' current' : ''}`;
      row.setAttribute('role', 'option');
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = chat.label;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = `${chat.turns} ${chat.turns === 1 ? 'message' : 'messages'} · ${ago(chat.updatedAt)}`;
      row.append(label, meta);
      row.addEventListener('click', () => pick(i));
      row.addEventListener('mousemove', () => {
        pickerIndex = i;
        renderPicker();
      });
      return row;
    });
    picker.replaceChildren(head, ...rows);
    picker.classList.add('open');
    selectTab('fern');
    renderPicker();
  });

  /** Shows an earlier chat in Fern's tab. An empty list clears the tab. */
  window.fern.onHistory(({ lines }) => {
    tabs.get('fern').logEl.replaceChildren();
    for (const line of lines) addLine({ ...line, tab: 'fern' });
  });

  // Capture phase: runs before the input's own key handling.
  document.addEventListener('keydown', (e) => {
    if (!picker.classList.contains('open')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      pickerIndex = (pickerIndex + (e.key === 'ArrowDown' ? 1 : -1) + pickerChats.length) % pickerChats.length;
      renderPicker();
    } else if (e.key === 'Enter') {
      pick(pickerIndex);
    } else if (e.key === 'Escape') {
      closePicker();
    } else {
      return;
    }
    e.preventDefault();
    e.stopPropagation();
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.fern.hide();
    if (e.metaKey && /^[1-9]$/.test(e.key)) {
      const id = [...tabs.keys()][Number(e.key) - 1];
      if (id) {
        e.preventDefault();
        selectTab(id);
      }
    }
  });

  window.fern.onApproval(({ id, text, detail, tab = 'fern' }) => {
    const card = document.createElement('div');
    card.className = 'approval';
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = `⚠ [${id}] ${text}`;
    const pre = document.createElement('pre');
    pre.textContent = detail;
    const actions = document.createElement('div');
    for (const [name, isAllowed] of [['Allow (y)', true], ['Deny (n)', false]]) {
      const button = document.createElement('button');
      button.textContent = name;
      button.className = isAllowed ? 'allow' : 'deny';
      button.addEventListener('click', () => window.fern.answerApproval(id, isAllowed));
      actions.append(button);
    }
    card.append(q, pre, actions);
    approvalCards.set(id, card);
    append(tab, card);
    selectTab(tabs.has(tab) ? tab : 'fern');
  });
  window.fern.onApprovalDone(({ id }) => {
    approvalCards.get(id)?.classList.add('done');
    approvalCards.delete(id);
  });

  // -------------------------------------------------------------------------
  // Command autocomplete, like Claude Code: type "/", then ↑ ↓, Tab to complete, Enter to run.

  const completeEl = document.getElementById('complete');
  const statusEl = document.getElementById('status');
  let commands = [];
  let matches = [];
  let completeIndex = 0;

  function closeComplete() {
    completeEl.classList.remove('open');
    matches = [];
  }

  function renderComplete() {
    completeEl.querySelectorAll('.cmd').forEach((el, i) => {
      el.classList.toggle('selected', i === completeIndex);
      el.setAttribute('aria-selected', String(i === completeIndex));
      if (i === completeIndex) el.scrollIntoView({ block: 'nearest' });
    });
  }

  /** Names that start with the typed text come first, then names that contain it. */
  function updateComplete() {
    const m = input.value.match(/^\/(\S*)$/);
    if (!m || picker.classList.contains('open')) return closeComplete();
    const q = m[1].toLowerCase();
    matches = [
      ...commands.filter((c) => c.name.toLowerCase().startsWith(q)),
      ...commands.filter((c) => !c.name.toLowerCase().startsWith(q) && c.name.toLowerCase().includes(q)),
    ];
    if (!matches.length) return closeComplete();
    completeIndex = 0;
    completeEl.replaceChildren(...matches.map((c, i) => {
      const row = document.createElement('div');
      row.className = `cmd k-${c.kind}`;
      row.setAttribute('role', 'option');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = `/${c.name}`;
      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = c.description;
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = { fern: 'Fern', claude: 'Claude', skill: 'skill' }[c.kind];
      row.append(name, desc, kind);
      row.addEventListener('mousedown', (e) => {
        e.preventDefault();
        completeIndex = i;
        runSelected();
      });
      return row;
    }));
    completeEl.classList.add('open');
    renderComplete();
  }

  function runSelected() {
    const c = matches[completeIndex];
    if (!c) return;
    input.value = `/${c.name}`;
    closeComplete();
    document.getElementById('form').requestSubmit();
  }

  input.addEventListener('input', updateComplete);
  input.addEventListener('blur', () => setTimeout(closeComplete, 100));

  // Capture phase: runs before the input's own keys (history, y/n).
  document.addEventListener('keydown', (e) => {
    if (!completeEl.classList.contains('open')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      completeIndex = (completeIndex + (e.key === 'ArrowDown' ? 1 : -1) + matches.length) % matches.length;
      renderComplete();
    } else if (e.key === 'Tab') {
      input.value = `/${matches[completeIndex].name} `;
      closeComplete();
    } else if (e.key === 'Enter') {
      runSelected();
    } else if (e.key === 'Escape') {
      closeComplete();
    } else {
      return;
    }
    e.preventDefault();
    e.stopPropagation();
  }, true);

  window.fern.onCommands((list) => {
    commands = list;
    if (completeEl.classList.contains('open')) updateComplete();
  });
  window.fern.onStatus((text) => { statusEl.textContent = text; });

  window.fern.onTab(({ id, title, status }) => upsertTab(id, title, status));
  window.fern.onSelect((id) => selectTab(id));
  window.fern.onLine(addLine);
  window.fern.onBusy((isBusy) => busy.classList.toggle('on', isBusy));
  window.fern.onFocus(() => input.focus());

  upsertTab('fern', 'Fern · main session', 'done');
  selectTab('fern');
  addLine({ who: 'info', text: 'Fern watches your Claude Code sessions and can start jobs. Each job gets its own tab. Type / for commands.' });
</script>
</body>
</html>
